<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="favShadow" x="-10%" y="-10%" width="125%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" floodColor="#0f172a" floodOpacity="0.18" />
    </filter>
    <filter id="favSym" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="0.8" floodColor="#000000" floodOpacity="0.25" />
    </filter>

    <!-- Green -->
    <linearGradient id="gGrad" x1="10" y1="4" x2="38" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="60%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>

    <!-- Red -->
    <linearGradient id="rGrad" x1="58" y1="4" x2="88" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F87171" />
      <stop offset="60%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>

    <!-- Yellow -->
    <linearGradient id="yGrad" x1="10" y1="52" x2="38" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Blue -->
    <linearGradient id="bGrad" x1="58" y1="52" x2="88" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="60%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>

  <!-- TOP-LEFT: GREEN (+) -->
  <g filter="url(#favShadow)">
    <path d="M 24,4 L 41,4 A 7,7 0 0,1 48,11 L 48,41 A 7,7 0 0,1 41,48 L 11,48 A 7,7 0 0,1 4,41 L 4,24 A 20,20 0 0,1 24,4 Z" fill="url(#gGrad)" />
  </g>
  <g filter="url(#favSym)">
    <rect x="15" y="22.5" width="22" height="7" rx="3.5" fill="#FFFFFF" />
    <rect x="22.5" y="15" width="7" height="22" rx="3.5" fill="#FFFFFF" />
  </g>

  <!-- TOP-RIGHT: RED (-) -->
  <g filter="url(#favShadow)">
    <path d="M 59,4 L 76,4 A 20,20 0 0,1 96,24 L 96,41 A 7,7 0 0,1 89,48 L 59,48 A 7,7 0 0,1 52,41 L 52,11 A 7,7 0 0,1 59,4 Z" fill="url(#rGrad)" />
  </g>
  <g filter="url(#favSym)">
    <rect x="62" y="22.5" width="24" height="7" rx="3.5" fill="#FFFFFF" />
  </g>

  <!-- BOTTOM-LEFT: YELLOW (×) -->
  <g filter="url(#favShadow)">
    <path d="M 11,52 L 41,52 A 7,7 0 0,1 48,59 L 48,89 A 7,7 0 0,1 41,96 L 24,96 A 20,20 0 0,1 4,76 L 4,59 A 7,7 0 0,1 11,52 Z" fill="url(#yGrad)" />
  </g>
  <g filter="url(#favSym)" transform="rotate(45 26 74)">
    <rect x="15" y="70.5" width="22" height="7" rx="3.5" fill="#FFFFFF" />
    <rect x="22.5" y="63" width="7" height="22" rx="3.5" fill="#FFFFFF" />
  </g>

  <!-- BOTTOM-RIGHT: BLUE (Sigma ∑) -->
  <g filter="url(#favShadow)">
    <path d="M 59,52 L 89,52 A 7,7 0 0,1 96,59 L 96,76 A 20,20 0 0,1 76,96 L 59,96 A 7,7 0 0,1 52,89 L 52,59 A 7,7 0 0,1 59,52 Z" fill="url(#bGrad)" />
  </g>
  <g filter="url(#favSym)">
    <path d="M 81,66 L 67.5,66 L 73.5,74 L 67.5,82 L 81,82" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
